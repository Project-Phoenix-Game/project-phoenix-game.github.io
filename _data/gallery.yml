# Per-image metadata for the Gallery page (_includes/gallery.html), keyed by filename
# (basename, including extension) as it appears under the folder configured via
# `gallery_path` in pages/gallery.md. All fields are optional - a missing entry, or a
# missing field on an existing entry, falls back to a title-cased version of the filename
# (see _includes/gallery.html). Add an entry here for any image dropped into that folder
# to give it real copy instead of the filename-derived fallback.
#
# - alt: img alt text (accessibility only, not shown on screen)
# - title: short name - shown on hover under the grid tile and as the bold heading in
#   the lightbox
# - description: longer sentence - shown only in the lightbox, under the title

book-glass.jpeg:
  alt: "A stack of books beside a pair of reading glasses"
  title: "Books & Reading Glasses"
  description: "Sample image - swap in concept art once available."

computer.jpeg:
  alt: "Close-up of a laptop keyboard and screen"
  title: "Laptop Close-Up"
  description: "Sample image - swap in concept art once available."

search-map.jpeg:
  alt: "A magnifying glass resting on a paper map"
  title: "Map & Magnifying Glass"
  description: "Sample image - swap in concept art once available."

travel.jpeg:
  alt: "Travel essentials packed for a trip"
  title: "Travel Essentials"
  description: "Sample image - swap in concept art once available."
